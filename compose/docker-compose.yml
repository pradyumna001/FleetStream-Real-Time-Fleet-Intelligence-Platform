# FleetStream core infrastructure: Kafka, MinIO (S3), Iceberg REST catalog.
#
# This file always starts. The heavier layers are additive overlays selected by
# profile, so a laptop can run a subset:
#   compose.spark.yml          profile: stream
#   compose.serving.yml        profile: serve
#   compose.orchestration.yml  profile: orchestrate
#
# Use the Makefile rather than invoking compose directly - it wires the overlay
# files together and preflights the Docker daemon.

name: fleetstream

x-minio-credentials: &minio-credentials
  AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-fleetstream}
  AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-fleetstream-local-secret}
  AWS_REGION: ${S3_REGION:-us-east-1}

services:
  # ---------------------------------------------------------------------------
  # Kafka 4.x in KRaft mode - no Zookeeper. Single broker, because one machine
  # cannot demonstrate real replication anyway; partition count is what matters
  # here, and that is set to 12 so consumer-group parallelism and partition skew
  # behave the way they would in a cluster.
  # ---------------------------------------------------------------------------
  kafka:
    image: apache/kafka:4.3.1
    container_name: fleetstream-kafka
    ports:
      - "9092:9092"     # host listener
      - "9101:9101"     # JMX
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:29092,PLAINTEXT_HOST://:9092,CONTROLLER://:9093
      # Two advertised listeners: containers reach the broker at kafka:29092,
      # the Windows host reaches it at localhost:9092. A single listener cannot
      # serve both, and getting this wrong is the classic "connects then hangs".
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: ${TELEMETRY_PARTITIONS:-12}
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: kafka
      KAFKA_HEAP_OPTS: -Xmx1G -Xms512M
      CLUSTER_ID: fleetstream-local-cluster
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:29092"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s
    networks: [fleetstream]

  # Creates topics with explicit partition counts, then exits. Idempotent:
  # --if-not-exists means re-running `make up` is harmless.
  kafka-init:
    image: apache/kafka:4.3.1
    container_name: fleetstream-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -euo pipefail
        BS=kafka:29092
        create() {
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server $$BS --create --if-not-exists \
            --topic "$$1" --partitions "$$2" --replication-factor 1
        }
        create "${TELEMETRY_TOPIC:-fleet.telemetry}" "${TELEMETRY_PARTITIONS:-12}"
        create "${INCIDENTS_TOPIC:-fleet.incidents}" 3
        create "${DLQ_TOPIC:-fleet.telemetry.dlq}" 3
        echo "--- topics ---"
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server $$BS --list
    networks: [fleetstream]
    restart: "no"

  # ---------------------------------------------------------------------------
  # MinIO stands in for S3. Same API, so the Spark s3a client, Iceberg's S3FileIO
  # and Trino all talk to it with the code they would use against real S3.
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: fleetstream-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"     # S3 API
      - "9001:9001"     # web console
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-fleetstream}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-fleetstream-local-secret}
      MINIO_DOMAIN: minio
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [fleetstream]

  minio-init:
    image: minio/mc:latest
    container_name: fleetstream-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        mc alias set local http://minio:9000 "${S3_ACCESS_KEY:-fleetstream}" "${S3_SECRET_KEY:-fleetstream-local-secret}"
        mc mb --ignore-existing local/${WAREHOUSE_BUCKET:-fleetstream}
        # Prefixes mirror the layout the Terraform S3 module provisions in AWS.
        for p in warehouse checkpoints raw quarantine; do
          mc mb --ignore-existing "local/${WAREHOUSE_BUCKET:-fleetstream}/$$p"
        done
        echo "--- bucket layout ---"
        mc ls -r local/${WAREHOUSE_BUCKET:-fleetstream} || true
    networks: [fleetstream]
    restart: "no"

  # Backing store for the Iceberg catalog.
  #
  # A catalog is shared mutable state that every engine writes to concurrently -
  # three streaming queries committing snapshots, plus Trino and dbt creating tables.
  # The stock REST fixture uses SQLite, which takes a database-wide write lock and
  # fails those writes with SQLITE_BUSY under exactly this load. Postgres is what a
  # real deployment would use behind a JDBC catalog (or Glue).
  catalog-db:
    image: postgres:16-alpine
    container_name: fleetstream-catalog-db
    environment:
      POSTGRES_USER: iceberg
      POSTGRES_PASSWORD: iceberg
      POSTGRES_DB: iceberg
    volumes:
      - catalog-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iceberg -d iceberg"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [fleetstream]

  # ---------------------------------------------------------------------------
  # Iceberg REST catalog. Backed by SQLite on a named volume rather than the
  # fixture's default in-memory store, so table metadata survives `make down`.
  # ---------------------------------------------------------------------------
  iceberg-rest:
    build:
      context: ..
      dockerfile: docker/iceberg-rest/Dockerfile
    image: fleetstream/iceberg-rest:1.10.1-pg
    container_name: fleetstream-iceberg-rest
    depends_on:
      minio-init:
        condition: service_completed_successfully
      catalog-db:
        condition: service_healthy
    ports:
      - "8181:8181"
    environment:
      <<: *minio-credentials
      CATALOG_WAREHOUSE: s3://${WAREHOUSE_BUCKET:-fleetstream}/warehouse
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      CATALOG_CATALOG__IMPL: org.apache.iceberg.jdbc.JdbcCatalog
      CATALOG_URI: jdbc:postgresql://catalog-db:5432/iceberg
      CATALOG_JDBC_USER: iceberg
      CATALOG_JDBC_PASSWORD: iceberg
      CATALOG_JDBC_SCHEMA__VERSION: V1
      REST_PORT: 8181
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8181/v1/config?warehouse=s3://${WAREHOUSE_BUCKET:-fleetstream}/warehouse"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 15s
    networks: [fleetstream]

  # ---------------------------------------------------------------------------
  # Telemetry simulator. Profiled so `make up` brings up infrastructure only and
  # data generation is an explicit, separate act.
  # ---------------------------------------------------------------------------
  simulator:
    build:
      context: ..
      dockerfile: docker/simulator/Dockerfile
    image: fleetstream/simulator:0.1.0
    container_name: fleetstream-simulator
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      TELEMETRY_TOPIC: ${TELEMETRY_TOPIC:-fleet.telemetry}
      SIM_VEHICLE_COUNT: ${SIM_VEHICLE_COUNT:-200}
      SIM_SPEEDUP: ${SIM_SPEEDUP:-60}
      SIM_SEED: ${SIM_SEED:-20260908}
      SIM_DUPLICATE_RATE: ${SIM_DUPLICATE_RATE:-0.01}
      SIM_LATE_RATE: ${SIM_LATE_RATE:-0.02}
      SIM_INVALID_RATE: ${SIM_INVALID_RATE:-0.005}
      SIM_HOT_VEHICLE: ${SIM_HOT_VEHICLE:-V9999}
      SIM_HOT_VEHICLE_MULTIPLIER: ${SIM_HOT_VEHICLE_MULTIPLIER:-25}
    command: ["--minutes", "${SIM_MINUTES:-10}"]
    volumes:
      - sim-manifests:/manifests
    profiles: [simulate]
    restart: "no"
    networks: [fleetstream]

volumes:
  kafka-data:
  catalog-db-data:
  sim-manifests:
  minio-data:

networks:
  fleetstream:
    name: fleetstream
