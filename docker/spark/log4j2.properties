# Quieter than the Spark default: at INFO the streaming logs are unreadable,
# and the signal we want (query progress) is drowned by connector chatter.
rootLogger.level = warn
rootLogger.appenderRef.stdout.ref = console

appender.console.type = Console
appender.console.name = console
appender.console.target = SYSTEM_ERR
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{HH:mm:ss} %-5p %c{1}: %m%n

# Our own code stays at INFO so job progress is visible.
logger.fleetstream.name = fleetstream
logger.fleetstream.level = info

# Streaming query progress reports - the useful ones.
logger.streaming.name = org.apache.spark.sql.execution.streaming.MicroBatchExecution
logger.streaming.level = warn

logger.kafka.name = org.apache.kafka
logger.kafka.level = error
logger.hadoop.name = org.apache.hadoop
logger.hadoop.level = error
logger.iceberg.name = org.apache.iceberg
logger.iceberg.level = warn
