# Trino reads the SAME Iceberg REST catalog and the SAME MinIO objects that Spark
# writes. Nothing is copied or synchronised: this is the lakehouse claim made
# concrete - one copy of the data, two engines.
#
# This is also the Athena stand-in. Athena is Presto-derived, so queries written
# here port across with the catalog binding changed to Glue.
connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://iceberg-rest:8181
iceberg.rest-catalog.warehouse=s3://fleetstream/warehouse

# Trino's native S3 filesystem rather than the legacy Hive one.
fs.native-s3.enabled=true
s3.endpoint=http://minio:9000
s3.region=us-east-1
# MinIO serves bucket-in-path URLs, not virtual-host style.
s3.path-style-access=true
s3.aws-access-key=fleetstream
s3.aws-secret-key=fleetstream-local-secret

# dbt materialises views for the staging and gold layers.
iceberg.security=allow-all
