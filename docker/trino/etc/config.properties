# Single-node Trino: coordinator and worker in one process. Fine for a laptop, and
# the SQL is identical to what a distributed cluster or Athena would run.
coordinator=true
node-scheduler.include-coordinator=true
http-server.http.port=8080
discovery.uri=http://localhost:8080

# Sized for a laptop running Kafka, Spark and Airflow alongside. These must stay
# below the JVM heap in jvm.config or Trino refuses to start.
query.max-memory=1GB
query.max-memory-per-node=512MB
memory.heap-headroom-per-node=384MB
